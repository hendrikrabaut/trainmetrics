[project]
name = "backend"
version = "0.1.0"
description = "TrainMetrics backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.142.2",
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
