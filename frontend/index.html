<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00272B">
  <title>TrainMetrics</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrainMetrics">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#vandaag">TrainMetrics</a>
    <nav aria-label="Hoofdmenu">
      <a href="#vandaag" data-view="vandaag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M6 9.5V20h12V9.5"/></svg>
        <span>Vandaag</span>
      </a>
      <a href="#trainingen" data-view="trainingen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        <span>Trainingen</span>
      </a>
      <a href="#plan" data-view="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/></svg>
        <span>Plan</span>
      </a>
      <a href="#statistieken" data-view="statistieken">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
        <span>Statistieken</span>
      </a>
      <a href="#trofeeen" data-view="trofeeen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v6a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 15v5M8 20h8"/></svg>
        <span>Trofeeën</span>
      </a>
    </nav>
    <div class="header-end">
      <a class="level-chip" id="level-chip" href="#trofeeen" hidden></a>
      <a class="profile-link" href="#profiel" data-view="profiel" aria-label="Profiel, sync en beheer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
      </a>
    </div>
  </header>
  <main id="app"></main>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
